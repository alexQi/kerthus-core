syntax = "proto3";
package kerthus.saas.v1;
option go_package = "github.com/alexQi/kerthus-core/gen/go/saas/v1;saasv1";

service Platform {
 rpc Login(LoginRequest) returns (LoginReply);
 rpc Logout(Context) returns (Result);
 rpc Profile(Context) returns (User);
 rpc Auth(Context) returns (AuthReply);
 rpc Query(QueryRequest) returns (QueryReply);
 rpc Save(SaveRequest) returns (SaveReply);
 rpc Delete(DeleteRequest) returns (Result);
 rpc SetStatus(StatusRequest) returns (Result);
 rpc ChangePassword(PasswordRequest) returns (Result);
 rpc ApproveTenant(ApproveRequest) returns (Result);
 rpc SetEntitlements(EntitlementsRequest) returns (Result);
 rpc SetRoleResources(RoleResourcesRequest) returns (Result);
 rpc SetRoleMembers(RoleMembersRequest) returns (Result);
 rpc CheckAccess(AccessRequest) returns (AccessReply);
 rpc AuthorizeApplicationModelInput(ModelInputAuthorizationRequest) returns (ModelInputRef);
 rpc RevokeApplicationMediaAccess(MediaRequest) returns (Result);
 rpc ListApplicationModels(AppAuthorization) returns (ModelCatalogReply);
 rpc ControlApplicationModelRun(ModelRunControlRequest) returns (ModelRunReply);
 rpc QueryApplicationModelRun(ModelRunRequest) returns (ModelRunReply);
 rpc RebindApplicationModel(ModelRebindRequest) returns (ModelCallReply);
 rpc SubmitApplicationModel(ModelSubmitRequest) returns (ModelCallReply);
 rpc LookupApplicationModel(ModelLookupRequest) returns (ModelCallReply);
 rpc QueryApplicationModel(ModelCallRequest) returns (ModelCallReply);
 rpc CancelApplicationModel(ModelCallRequest) returns (ModelCallReply);
 rpc BeginApplicationMedia(MediaBeginRequest) returns (MediaReply);
 rpc WriteApplicationMediaPart(MediaPartRequest) returns (MediaReply);
 rpc ConfirmApplicationMedia(MediaRequest) returns (MediaReply);
 rpc ReadApplicationMedia(MediaReadRequest) returns (MediaChunk);
 rpc DeleteApplicationMedia(MediaRequest) returns (Result);
 rpc CreateApplicationPlayback(MediaRequest) returns (PlaybackReply);
 rpc ReadApplicationPlayback(PlaybackReadRequest) returns (MediaChunk);
 rpc ListApplicationTools(Context) returns (ApplicationToolsReply);
 rpc PrepareApplicationTool(ApplicationToolRequest) returns (DelegationReply);
 rpc IssueDelegation(DelegationRequest) returns (DelegationReply);
 rpc CheckDelegation(DelegationCheck) returns (AccessReply);
 rpc ResumeJobAuthorization(JobResumeRequest) returns (DelegationReply);
 rpc ReadJobModelReceipt(JobReceiptRequest) returns (ModelCallReply);
 rpc ReadHistoricalModelReceipt(HistoricalModelReceiptRequest) returns (HistoricalModelReceiptReply);
 rpc CreateJobAuthorization(JobAuthorizationRequest) returns (DelegationReply);
 rpc CreateBackgroundJobAuthorization(BackgroundJobAuthorizationRequest) returns (DelegationReply);
 rpc RenewBackgroundJobAuthorization(RenewBackgroundJobAuthorizationRequest) returns (DelegationReply);
 rpc AuthorizeBackgroundModelInput(BackgroundModelInputAuthorizationRequest) returns (ModelInputRef);
 rpc DeriveJobAuthorization(JobDerivationRequest) returns (DelegationReply);
 rpc PromoteJobSource(PromoteJobSourceRequest) returns (DelegationReply);
 rpc CheckJobAuthorization(AppAuthorization) returns (AccessReply);
 rpc RevokeJobAuthorization(AppAuthorization) returns (Result);
 rpc CreateUpload(UploadRequest) returns (UploadReply);
 rpc ConfirmUpload(ConfirmUploadRequest) returns (UploadReply);
 rpc ResolveDownload(FileRequest) returns (UploadReply);
 rpc CancelUpload(FileRequest) returns (Result);
 rpc Health(Empty) returns (Result);
}
message Empty {}
message Result { bool success=1; }
message Context { string token=1; int64 tenant_id=2; int64 app_id=3; int64 unit_id=4; int64 section_id=5; string request_id=6; }
message LoginRequest { string username=1; string password=2; string scene=3; }
message LoginReply { int64 user_id=1; string access_token=2; int64 expires_time=3; int64 tenant_id=4; int64 app_id=5; int64 unit_id=6; int64 section_id=7; string app_code=8; string home=9; string frontend_entry=10; string frontend_base_path=11; string frontend_home=12; }
message User { int64 id=1; string phone=2; string email=3; string name=4; string avatar=5; int32 sex=6; optional int32 status=7; int64 created_at=8; int64 updated_at=9; }
message Tenant { int64 id=1; string name=2; string logo=3; string contact_person=4; string contact_phone=5; string contact_email=6; string credit_code=7; string address_json=8; string address_detail=9; string description=10; optional int32 status=11; int32 verify_status=12; int64 expires_at=13; int64 created_at=14; string agent_provider=15; string agent_model=16; string agent_endpoint=17; string agent_api_key=18; bool agent_enabled=19; string agent_providers=20; }
message Member { User user=1; int64 tenant_id=2; int64 app_id=3; repeated int64 org_ids=4; repeated int64 position_ids=5; repeated Org orgs=6; repeated Position positions=7; optional int32 status=8; bool has_add=9; }
message Org { int64 id=1; int64 tenant_id=2; int64 parent_id=3; int64 unit_id=4; string type=5; string name=6; string short_name=7; optional int32 status=8; int32 sort=9; string remark=10; }
message Position { int64 id=1; int64 tenant_id=2; int64 org_id=3; string name=4; optional int32 status=5; string remark=6; string org_name=7; int64 created_at=8; int64 updated_at=9; }
message App { int64 id=1; string code=2; string name=3; string version=4; optional int32 status=5; string service_key=6; string route_prefix=7; string home=8; string frontend_entry=9; int64 expires_at=10; bool managed=11; string icon=12; string description=13; string remark=14; int64 tenant_app_id=15; string type=16; string url=17; bool is_public=18; string frontend_base_path=19; string frontend_home=20; }
message Resource { int64 id=1; int64 app_id=2; int64 parent_id=3; string code=4; string name=5; string type=6; string path=7; string component=8; string icon=9; string meta_json=10; optional int32 status=11; int32 sort=12; bool is_public=13; bool is_data_access=14; repeated Operation operations=15; string redirect=16; string remark=17; string open_with=18; }
message Operation { int64 id=1; int64 app_id=2; int64 resource_id=3; string operation_id=4; string method=5; string path=6; string group=7; string action=8; }
message Role { int64 id=1; int64 tenant_id=2; string code=3; string name=4; string remark=5; optional int32 status=6; bool administrator=7; repeated ResourceGrant grants=8; }
message ResourceGrant { int64 app_id=1; int64 resource_id=2; int32 data_scope=3; }
message TenantApp { int64 id=1; int64 tenant_id=2; int64 app_id=3; string tenant_name=4; string app_name=5; int64 expiration_time=6; repeated int64 resource_ids=7; int64 created_at=8; int64 updated_at=9; }
message District { int64 id=1; int64 parent_id=2; string name=3; bool has_children=4; }
message Audit { int64 id=1; int64 actor_id=2; int64 tenant_id=3; string action=4; int64 target_id=5; string request_id=6; int64 created_at=7; }
message AuthReply { repeated string roles=1; repeated string permissions=2; repeated Resource resources=3; LoginReply context=4; bool platform_admin=5; }
enum Kind { KIND_UNSPECIFIED=0; USERS=1; TENANTS=2; MEMBERS=3; ORGS=4; POSITIONS=5; APPS=6; RESOURCES=7; OPERATIONS=8; TENANT_APPS=9; ROLES=10; DISTRICTS=11; AUDITS=12; }
message QueryRequest { Context context=1; Kind kind=2; int64 id=3; int64 target_tenant_id=4; int64 target_app_id=5; int64 parent_id=6; int64 role_id=7; int32 page=8; int32 page_size=9; string search=10; string sort=11; bool desc=12; bool available_only=13; bool for_authorization=14; string name=15; string phone=16; int64 org_id=17; bool include_children=18; int64 created_from=19; int64 created_before=20; string code=21; string tenant_name=22; string app_name=23; bool tenant_apps_only=24; bool include_agent_credentials=25; }
message QueryReply { int64 total=1; repeated User users=2; repeated Tenant tenants=3; repeated Member members=4; repeated Org orgs=5; repeated Position positions=6; repeated App apps=7; repeated Resource resources=8; repeated Operation operations=9; repeated TenantApp tenant_apps=10; repeated Role roles=11; repeated District districts=12; repeated Audit audits=13; }
message SaveRequest { Context context=1; string password=2; oneof entity { User user=3; Tenant tenant=4; Member member=5; Org org=6; Position position=7; App app=8; Resource resource=9; Role role=10; } }
message SaveReply { int64 id=1; }
message DeleteRequest { Context context=1; Kind kind=2; int64 id=3; int64 target_tenant_id=4; }
message StatusRequest { Context context=1; Kind kind=2; int64 id=3; int32 status=4; int64 target_tenant_id=5; }
message PasswordRequest { Context context=1; int64 user_id=2; string old_password=3; string new_password=4; }
message ApproveRequest { Context context=1; int64 tenant_id=2; bool approved=3; string admin_password=4; }
message AppGrant { int64 app_id=1; int64 expires_at=2; repeated int64 resource_ids=3; }
message EntitlementsRequest { Context context=1; repeated int64 tenant_ids=2; repeated AppGrant apps=3; repeated int64 revoke_ids=4; }
message RoleResourcesRequest { Context context=1; int64 tenant_id=2; int64 role_id=3; repeated ResourceGrant grants=4; }
message RoleMembersRequest { Context context=1; int64 tenant_id=2; int64 role_id=3; repeated int64 user_ids=4; bool remove=5; }
message AccessRequest { Context context=1; string app_code=2; string method=3; string path=4; }
message AccessReply { int64 user_id=1; int64 tenant_id=2; int64 app_id=3; bool all_within_tenant=4; repeated int64 user_ids=5; string service_key=6; string route_prefix=7; string operation_id=8; int64 resource_version=9; int64 unit_id=10; int64 section_id=11; string request_id=12; string authorization=13; int64 expires_at=14; string policy_json=15; string service_principal_id=16; int64 granted_owner_id=17; string authorization_kind=18; string granted_object_id=19; string granted_purpose=20; }
message UploadRequest { Context context=1; string content_type=2; int64 size=3; string filename=4; bool private=5; string idempotency_key=6; string input_hash=7; string source=8; string sha256=9; }
message UploadReply { int64 id=1; string object_key=2; int64 max_size=3; string filename=4; string content_type=5; int64 size=6; bool private=7; string sha256=8; string source=9; }
message ConfirmUploadRequest { Context context=1; int64 id=2; }

message FileRequest { Context context=1; int64 id=2; string object_key=3; }

message DelegationRequest { AccessRequest access=1; string fingerprint=2; string idempotency_key=3; }
message DelegationReply { string ticket=1; int64 expires_at=2; AccessReply access=3; int64 tenant_id=4; int64 app_id=5; string object_id=6; string purpose=7; int64 owner_id=8; int64 media_id=9; string content_version=10; int64 grant_id=11; }
message DelegationCheck { string app_code=1; string ticket=2; string method=3; string path=4; string fingerprint=5; string request_id=6; }
message AppAuthorization { string app_code=1; string authorization=2; }
message JobAuthorizationRequest { AppAuthorization auth=1; string object_id=2; string purpose=3; int64 owner_id=4; int64 ttl_seconds=5; repeated ModelInputRef inputs=6; }
message BackgroundJobAuthorizationRequest { string app_code=1; string principal_id=2; int64 tenant_id=3; string object_id=4; string purpose=5; int64 owner_id=6; string method=7; string path=8; int64 ttl_seconds=9; string idempotency_key=10; int64 media_id=11; string content_version=12; }
message RenewBackgroundJobAuthorizationRequest { string app_code=1; string principal_id=2; int64 grant_id=3; string authorization=4; int64 tenant_id=5; string object_id=6; string purpose=7; int64 owner_id=8; int64 media_id=9; string content_version=10; string method=11; string path=12; int64 ttl_seconds=13; string idempotency_key=14; }
message BackgroundModelInputAuthorizationRequest { AppAuthorization auth=1; MediaRequest media=2; string content_version=3; string role=4; }

message ApplicationTool { string name=1; string operation_id=2; string method=3; string path=4; string policy_json=5; string service_key=6; int64 resource_version=7; }
message ApplicationToolsReply { repeated ApplicationTool tools=1; }
message ApplicationToolRequest { Context context=1; string name=2; string input_json=3; string idempotency_key=4; }

message MediaBeginRequest { AppAuthorization auth=1; string object_id=2; string purpose=3; int64 owner_id=4; string filename=5; string content_type=6; int64 size=7; string idempotency_key=8; }
message MediaRequest { AppAuthorization auth=1; int64 media_id=2; string object_id=3; string purpose=4; int64 owner_id=5; }
message MediaPartRequest { MediaRequest media=1; int64 number=2; bytes data=3; string digest=4; }
message MediaReply { int64 media_id=1; int64 size=2; string content_type=3; string filename=4; string status=5; int64 part_bytes=6; repeated int64 completed_parts=7; int64 expires_at=8; string content_version=9; int64 access_version=10; }
message MediaReadRequest { MediaRequest media=1; int64 offset=2; int64 length=3; bool metadata_only=4; }
message MediaChunk { MediaReply media=1; bytes data=2; }
message PlaybackReply { string token=1; int64 expires_at=2; int64 size=3; }
message PlaybackReadRequest { string token=1; int64 offset=2; int64 length=3; bool metadata_only=4; }

message ModelCatalogItem { string selector=1; string model=2; string kind=3; bool asynchronous=4; bool supports_cancel=5; int64 daily_calls=6; repeated string sizes=7; repeated int32 durations=8; repeated string input_roles=9; int32 max_inputs=10; string capability_version=11; string model_version=12; repeated string input_mime_types=13; int64 max_input_bytes=14; int64 max_total_input_bytes=15; int32 max_texts=16; int32 max_text_bytes=17; int32 embedding_dimensions=18; string encoding=19; int32 max_total_text_bytes=20; int64 max_output_tokens=21; int32 scheduler_version=22; }
message ModelCatalogReply { repeated ModelCatalogItem models=1; }
message ModelSubmitRequest { AppAuthorization auth=1; string selector=2; string idempotency_key=3; string prompt=4; string size=5; int32 seconds=6; repeated ModelInputRef inputs=7; repeated string texts=8; int64 max_output_tokens=9; int32 scheduler_version=10; string root_run_id=11; }
message ModelLookupRequest { ModelSubmitRequest request=1; }
message ModelCallRequest { AppAuthorization auth=1; int64 call_id=2; }
message ModelCallDiagnostic { string code=1; string phase=2; int32 http_status=3; string upstream_request_id=4; string submission=5; string message=6; bool retry_safe=7; string upstream_status_code=8; string upstream_log_id=9; int32 request_bytes=10; string request_sha256=11; string route_sha256=12; string protocol=13; string model=14; int64 started_at_unix_ms=15; int64 finished_at_unix_ms=16; int64 dns_ms=17; int64 connect_ms=18; int64 tls_ms=19; int64 write_ms=20; int64 first_byte_ms=21; int64 read_ms=22; string http_version=23; string alpn=24; string remote_addr=25; string upstream_error_code=26; string upstream_error_type=27; string upstream_message=28; string retry_class=29; int64 retry_after_seconds=30; string retry_policy=31; string execution_outcome=32; }
message ModelCallReply { int64 call_id=1; string state=2; string result_json=3; string usage_json=4; string request_id=5; string message=6; ModelCallDiagnostic diagnostic=7; string recovery=8; int32 scheduler_version=9; string queue_phase=10; string root_run_id=11; }

message ModelInputRef { int64 media_id=1; string content_version=2; string role=3; string authorization=4; int64 timestamp_ms=5; }
message ModelInputAuthorizationRequest { MediaRequest media=1; string content_version=2; string role=3; }

message JobDerivationRequest { AppAuthorization auth=1; repeated ModelInputRef inputs=2; int64 expires_in_seconds=3; }
// Promotes one ready media object produced by a source-less producer job into
// a new source-only root analysis job. The platform derives object scope from
// the producer grant; callers cannot supply tenant/app/owner overrides.
message PromoteJobSourceRequest {
 AppAuthorization auth=1;
 int64 media_id=2;
 string content_version=3;
 int64 access_version=4;
 int64 ttl_seconds=5;
 string idempotency_key=6;
}

message ModelRunRequest { AppAuthorization auth=1; string root_run_id=2; }
message ModelRunControlRequest { AppAuthorization auth=1; string root_run_id=2; string state=3; int64 control_seq=4; }
message ModelRunReply { string root_run_id=1; string state=2; int64 ack_seq=3; int32 scheduler_version=4; }
message ModelRebindRequest { AppAuthorization auth=1; int64 call_id=2; }

message JobResumeRequest { AppAuthorization auth=1; string job_authorization=2; string object_id=3; string purpose=4; int64 owner_id=5; int64 ttl_seconds=6; }
message JobReceiptRequest { AppAuthorization auth=1; string job_authorization=2; ModelSubmitRequest request=3; }

// Current request authorization for a ledger snapshot, never execution recovery.
message HistoricalModelReceiptRequest {
 AppAuthorization auth=1;
 int64 call_id=2;
 string object_id=3;
 string purpose=4;
 int64 owner_id=5;
 ModelSubmitRequest request=6;
 repeated ModelInputRef current_inputs=7;
 repeated ModelInputRef current_sources=8;
}
message HistoricalModelReceiptReply {
 int64 call_id=1;
 string state=2;
 string result_json=3;
 string usage_json=4;
 string request_id=5;
 int32 scheduler_version=6;
 string root_run_id=7;
 string queue_phase=8;
 string diagnostic_code=9;
 string submission=10;
}
